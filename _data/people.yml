# Lab roster for the Personnel page (personnel.html).
#
# Each section below is a list of people, shown on the page in this order.
# To add someone, copy an existing entry and change it.
# To remove someone, delete their entry.
# To move someone (for example, a student who graduated), cut their entry
# and paste it into another section.
#
# Fields:
#   name:   shown as the heading of the person's box
#   photo:  path to the photo, e.g. People/smith.jpg (leave out if none yet)
#   width, height: optional photo size in pixels (default 300 x 300)
#   bio:    the text under the name. HTML is allowed (links, <br>, etc.).
#           Keep the "|" after bio: and indent every line of the text.

pi:
  - name: Prof. Kater Murch
    photo: People/portrait_large/murch_kater.jpg
    bio: |
      <dl>
        <dt>Education</dt>
        <dd>2008 Ph.D., University of California, Berkeley</dd>
        <dd>2007 MA, University of California, Berkeley</dd>
        <dd>1998 BA, Reed College</dd>
      </dl>
      <br>
      <dl>
        <dt>Professional History</dt>
        <dd> 2026-present, Professor, University of California, Berkeley</dd>
        <dd>2018-present Associate Professor, Washington University</dd>
        <dd>2014-2018 Assistant Professor, Washington University</dd>
        <dd>2008-2013 Postdoctoral Scholar, University of California, Berkeley</dd>
      </dl>
      <br>
      <dl>
        <dd>Kater received his B.A. in physics from Reed College in 2002. After that, he spent a long year slacking off, working as a bee keeper, honing his guitar skills, and studying the cello before finally starting his Ph.D. work at UC Berkeley with Prof. Dan Stamper-Kurn. After some time studying Bose-Einstein condensation in multiply connected geometries, Kater focused his interests on general problems in quantum measurement, and performed some of the first studies of position measurement quantum backaction. After receiving his Ph.D. in 2008, Kater continued work in the Stamper-Kurn group studying a possible super-solid phase of matter which occurs in spinor-Bose-Einsten condensates, and constructing a state of the art BEC apparatus. After a short postdoc in the Stamper-Kurn Group, Kater joined Irfan Siddiqi's group to study superconducting quantum circuits, where he continued to study basic questions in quantum measurement and quantum noise. In 2014 Kater joined the faculty at Washington University. In 2015 Kater received the Alfred P. Sloan Fellowship in Physics. Kater received the St. Louis Academy of Science Innovation Award in 2017. In 2018, Kater received the Cottrell Scholar Award and an NSF CAREER Award.
        <br>
        <br>
        <a href="https://web.archive.org/web/20151002045518/http://artsci.wustl.edu/articles/2014/wine-quantum-mechanics-and-nature-time"><strong>An interview with Kater: Wine, Quantum Mechanics and the Nature of Time</strong></a>
        <br>
        <a href="https://web.archive.org/web/20240909180358/https://www.reed.edu/reed_magazine/june2015/articles/features/KaterMurch/murch.html"><strong>Cheating Heisenberg: Feature in Reed Magazine</strong></a>
        <br>
        <br>
        <a href="mailto:katermurch@berkeley.edu">katermurch@berkeley.edu</a>
        </dd>
      </dl>

postdocs:
  - name: Kaiwen Zheng
    photo: People/KZ_060422.jpg
    bio: |
      I admire Heike Kamerlingh Onnes’ way of science as he was able to focus on a simple yet important challenge of reaching lower and lower temperatures. He created the field of low temperature physics and discovered superconductivity as a result. I aspire to become a scientist as awesome as him. Like Onnes, my research also focuses on a challenge simple but important which is to mitigate quantum decoherence. If this problem is solved, people will enjoy the benefit of quantum technologies and, if we're a bit romantic, see quantum effect of macroscopic objects with their own naked eyes! I don’t think I am a materials scientist, a quantum engineer, or a condensed matter physicist, although I do apply their techniques when tackling different aspects of decoherence. I’m a guy who loves spending time in the lab with his equipment, who’s on his way of becoming a great scientist.
      <br>
      <br>
      Ph.D., Physics, Washington University in St. Louis
      <br>
      M.S.E., Materials Science, University of Florida
      <br>
      B.S., Materials Science, Arizona State University
      <br>
      <br>
      <a href="https://scholar.google.com/citations?hl=en&user=bE5SUKUAAAAJ&inst=2230987035966559800"><strong>Google Scholar</strong></a>
      &emsp;
      <a href="https://www.linkedin.com/in/kaiwen-zheng-259913105/"><strong>LinkedIn</strong></a>


